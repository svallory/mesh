# Runs `bun run verify`, the one command that runs every check in the repository
# (tests, type checks, the docs build and link check, the blog generated-tree guard),
# as one job per group of workspace packages (scripts/verify-groups.json), side by side,
# plus one job named `verify` that passes only when every group passed. That job is the
# required check on `main`, so its name stays `verify`.
# ADR-0031 recorded why this file did not exist: the `@mxlang` packages came from a
# `link:` checkout a hosted runner cannot have. They are published on the registry the
# root `bunfig.toml` scopes `@mxlang` to, so an install on a runner is an ordinary one.
name: verify

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow checks out the repository and reads it. It pushes
# nothing, writes no comments and needs no token beyond the default read-only one.
permissions:
  contents: read

# One run per ref; a newer push cancels the run the newer push supersedes.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  group:
    name: verify (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Like verify.ts itself: one run lists every broken group.
      fail-fast: false
      matrix:
        # Exactly the group names of scripts/verify-groups.json (scripts/verify/plan.test.ts
        # checks it); verify.ts --group refuses to run when a package is in no group.
        group: [compiler, cli, data, hyper, rest]
    # The data group runs data-postgres, whose tests need a Postgres server: a service
    # container that lives for the job. An empty image starts no service, so the other
    # groups pay nothing for it. The password is a throwaway for that one container; it
    # differs from the user and database names, or the test that a connection error never
    # prints the password would find it in the user name.
    services:
      postgres:
        image: ${{ matrix.group == 'data' && 'postgres:16.16' || '' }}
        env:
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: ci-throwaway-pw
          POSTGRES_DB: mesh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mesh" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      # data-postgres's tests read it; with CI set and the variable empty they fail
      # instead of skipping, so only the group that runs them sets it.
      MESH_TEST_POSTGRES_URL: ${{ matrix.group == 'data' && 'postgres://mesh:ci-throwaway-pw@localhost:5432/mesh' || '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The run only reads the checkout, so the token is not persisted into the
          # git config where a later step (or a poisoned dependency's script) could
          # pick it up.
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The version the repository pins, in package.json#packageManager
          # (bun@1.4.2) and in the docs image's base image (oven/bun:1.4.2).
          bun-version: "1.4.2"

      # No secrets: every dependency in bun.lock is either on the public registry or on
      # https://npm.saulo.tech, which is read-only for everyone. `--frozen-lockfile`
      # fails if bun.lock would change, so a run cannot pass on a lockfile the pull
      # request forgot to commit.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify ${{ matrix.group }}
        run: bun run verify -- --group ${{ matrix.group }}

  verify:
    # The required check's name; branch protection is not touched.
    name: verify
    needs: group
    # Runs (and fails) when a group failed, instead of being skipped, which GitHub would
    # report as a skipped required check; unlike always(), a run cancelled by a newer push
    # gets no red verify.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # needs.group.result is success only when every matrix job succeeded; failure,
      # cancelled and skipped all fail here.
      - name: Every group passed
        run: test "${{ needs.group.result }}" = "success"
