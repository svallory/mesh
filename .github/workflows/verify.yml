# Runs `bun run verify`, the one command that runs every check in the repository
# (tests, type checks, the docs build and link check, the blog generated-tree guard).
# ADR-0031 recorded why this file did not exist: the `@mxlang` packages came from a
# `link:` checkout a hosted runner cannot have. They are published on the registry the
# root `bunfig.toml` scopes `@mxlang` to, so an install on a runner is an ordinary one.
name: verify

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow checks out the repository and reads it. It pushes
# nothing, writes no comments and needs no token beyond the default read-only one.
permissions:
  contents: read

# One run per ref; a newer push cancels the run the newer push supersedes.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The run only reads the checkout, so the token is not persisted into the
          # git config where a later step (or a poisoned dependency's script) could
          # pick it up.
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The version the repository pins, in package.json#packageManager
          # (bun@1.3.14) and in the docs image's base image (oven/bun:1.3.14).
          bun-version: "1.3.14"

      # No secrets: every dependency in bun.lock is either on the public registry or on
      # https://npm.saulo.tech, which is read-only for everyone. `--frozen-lockfile`
      # fails if bun.lock would change, so a run cannot pass on a lockfile the pull
      # request forgot to commit.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify