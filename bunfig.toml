# @mxlang is published on the operator's own registry, https://npm.saulo.tech,
# and nowhere else. It is a read-only Verdaccio for this repository's scope: the
# @mxlang packages are installed from it by anyone, without an uplink or a token,
# so only this scope ever points at it. Every other package keeps the default
# registry.
#
# packages/compiler depends on @mxlang/core and @mxlang/data by exact version
# through this entry, which is what lets a GitHub runner run `bun install
# --frozen-lockfile` (see .github/workflows/verify.yml). A contributor who needs
# an unreleased MX commit links a local checkout instead, which is a temporary edit
# to packages/compiler/package.json that is never committed; see "Dependencies and
# the registry" in
# apps/docs/docs/architecture/contributing.md.
#
# See apps/docs/docs/architecture/decisions/0065-mx-highlighting-on-the-docs-site.md
# (ADR-0065) for why the docs highlighter comes from there.
[install.scopes]
"@mxlang" = "https://npm.saulo.tech"