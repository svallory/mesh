# Static serving for the docmd build output (one index.html per route).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Missing paths render the site 404 page with a real 404 status.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
