# Static serving for the docmd build output (one index.html per route).
# nginx only sees plain HTTP behind the Traefik proxy, so redirects must stay relative.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/html text/plain text/xml text/css application/javascript application/json application/xml image/svg+xml;

    # add_header in a location replaces the inherited ones, so the security
    # headers are repeated in every location that sets its own header.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # css/ and js/ files carry a ?v= cache-buster, so they can be cached for good.
    location ~ ^/assets/(css|js)/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else under /assets/ (favicon, images, i18n) has no cache-buster.
    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # A directory without index.html is a 404, not nginx's default 403.
    error_page 403 =404 /404.html;

    # Missing paths render the site 404 page with a real 404 status.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
